description: >-
  Prodigy Education is a Canadian K-8 game-based learning company best known for Prodigy Math
  and Prodigy English — fantasy RPG-style products in which students battle and quest by
  answering curriculum-aligned questions. The product is free for teachers and is monetized
  through optional parent memberships. Prodigy is consumer- and classroom-facing with no
  public developer API or partner program. Its integration surface is school rostering and
  SSO: Clever (SSO + Secure Sync district rostering), ClassLink (SSO, with OneRoster
  district rostering rolling out), and Google (SSO + Google Classroom assignment creation).
